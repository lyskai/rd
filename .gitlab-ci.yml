image: ridehal-toolchain-base:v1.0

stages:
  - start
  - build
  - test
  - pack

start:
  stage: start
  script:
    - echo "Start ridehal CI jobs ..."
  tags:
    - ridehal-dev
  rules:
    - if: '$CI_COMMIT_TAG == "master"'
      when: manual
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: always
  timeout: 1h

build qnx:
  stage: build
  script:
    - echo "Start building ridehal for QNX"
    - python3 /data/scripts/get_build_config.py
    - sh /data/scripts/build_package_qnx.sh
  tags:
    - ridehal-dev
  rules:
    - if: '$CI_COMMIT_TAG == "master"'
      when: on_success
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: on_success
  timeout: 1h

build ubuntu:
  stage: build
  script:
    - echo "Start building ridehal for HGY Ubuntu"
    - python3 /data/scripts/get_build_config.py
    - sh /data/scripts/build_package_ubuntu.sh
  tags:
    - ridehal-dev
  rules:
    - if: '$CI_COMMIT_TAG == "master"'
      when: on_success
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: on_success
  timeout: 1h

build linux:
  stage: build
  script:
    - echo "Start building ridehal for HGY Linux"
    - python3 /data/scripts/get_build_config.py
    - sh /data/scripts/build_package_linux.sh
  tags:
    - ridehal-dev
  rules:
    - if: '$CI_COMMIT_TAG == "master"'
      when: on_success
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: on_success
  timeout: 1h

gtest-qnx:
  stage: test
  script:
    - echo "Start running gtest for qnx"
    - sh /data/scripts/run_gtest_qnx.sh
    - python3 /data/scripts/parse_gtest_output_qnx.py
  tags:
    - ridehal-dev
  rules:
    - if: '$CI_COMMIT_TAG == "master"'
      when: on_success
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: on_success
  timeout: 1h

gtest-ubuntu:
  stage: test
  script:
    - echo "Start running gtest for ubuntu"
    - sh /data/scripts/run_gtest_ubuntu.sh
    - python3 /data/scripts/parse_gtest_output_ubuntu.py
  tags:
    - ridehal-dev
  rules:
    - if: '$CI_COMMIT_TAG == "master"'
      when: on_success
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: on_success
  timeout: 1h

gtest-linux:
  stage: test
  script:
    - echo "Start running gtest for linux"
    - sh /data/scripts/run_gtest_linux.sh
    - python3 /data/scripts/parse_gtest_output_linux.py
  tags:
    - ridehal-dev
  rules:
    - if: '$CI_COMMIT_TAG == "master"'
      when: on_success
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: on_success
  timeout: 1h

generate packages:
  stage: pack
  script:
    - echo "Generating ridehal packages"
    - mkdir packages
    - mv /data/packages/ridehal/ridehal-aarch64-*.tar.gz ./packages
  artifacts:
    name: "ridehal-build-packages"
    when: on_success
    expire_in: 6 hours
    paths:
      - packages
  tags:
    - ridehal-dev
  rules:
    - if: '$CI_COMMIT_TAG == "master"'
      when: manual
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: manual
  allow_failure: true
  timeout: 1h

