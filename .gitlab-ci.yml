image: ridehal-toolchain-base:v1.0

stages:
  - start
  - build
  - test
  - eval
  - check
  - release

start:
  stage: start
  script:
    - echo "Start ridehal CI jobs ..."
  tags:
    - ridehal-dev
  rules:
    - if: '$CI_COMMIT_TAG == "master"'
      when: manual
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: always
  timeout: 1h

build qnx:
  stage: build
  script:
    - echo "Start building ridehal for QNX"
    - python3 /data/scripts/build_package.py -v qnx
  tags:
    - ridehal-dev
  rules:
    - if: '$CI_COMMIT_TAG == "master"'
      when: on_success
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: on_success
  timeout: 1h

build ubuntu:
  stage: build
  script:
    - echo "Start building ridehal for HGY Ubuntu"
    - python3 /data/scripts/build_package.py -v ubuntu
  tags:
    - ridehal-dev
  rules:
    - if: '$CI_COMMIT_TAG == "master"'
      when: on_success
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: on_success
  timeout: 1h

build linux:
  stage: build
  script:
    - echo "Start building ridehal for HGY Linux"
    - python3 /data/scripts/build_package.py -v linux
  tags:
    - ridehal-dev
  rules:
    - if: '$CI_COMMIT_TAG == "master"'
      when: on_success
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: on_success
  timeout: 1h

gtest-qnx:
  stage: test
  script:
    - echo "Start running gtest for qnx"
    - sh /data/scripts/run_gtest_qnx.sh
    - python3 /data/scripts/parse_gtest_output_qnx.py
  tags:
    - ridehal-dev
  rules:
    - if: '$CI_COMMIT_TAG == "master"'
      when: on_success
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: on_success
  timeout: 1h

gtest-ubuntu:
  stage: test
  script:
    - echo "Start running gtest for ubuntu"
    - sh /data/scripts/run_gtest_ubuntu.sh
    - python3 /data/scripts/parse_gtest_output_ubuntu.py
  tags:
    - ridehal-dev
  rules:
    - if: '$CI_COMMIT_TAG == "master"'
      when: on_success
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: on_success
  timeout: 1h

gtest-linux:
  stage: test
  script:
    - echo "Start running gtest for linux"
    - sh /data/scripts/run_gtest_linux.sh
    - python3 /data/scripts/parse_gtest_output_linux.py
  tags:
    - ridehal-dev
  rules:
    - if: '$CI_COMMIT_TAG == "master"'
      when: on_success
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: on_success
  timeout: 1h

perf-eval-ubuntu:
  stage: eval
  script:
    - echo "Start running perf evaluation for ubuntu"
    - sh /data/scripts/run_perf_eval_ubuntu.sh
  tags:
    - ridehal-dev
  rules:
    - if: '$CI_COMMIT_TAG == "master"'
      when: manual
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: manual
  allow_failure: true
  timeout: 1h

static-stan:
  stage: check
  script:
    - echo "Start code static scan"
    - sh /data/scripts/run_static_scan.sh
  artifacts:
    name: "static-scan-reports"
    when: on_success
    expire_in: 6 hours
    paths:
      - staticScan-reports
  tags:
    - ridehal-dev
  rules:
    - if: '$CI_COMMIT_TAG == "master"'
      when: manual
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: manual
  allow_failure: true
  timeout: 1h


generate packages:
  stage: release
  script:
    - echo "Generating ridehal packages"
    - mkdir -p packages
    - cp -v /data/build/ridehal/packages/$CI_MERGE_REQUEST_IID/ridehal-aarch64-*.tar.gz ./packages
  artifacts:
    name: "ridehal-build-packages"
    when: on_success
    expire_in: 6 hours
    paths:
      - packages
  tags:
    - ridehal-dev
  rules:
    - if: '$CI_COMMIT_TAG == "master"'
      when: manual
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      when: manual
  allow_failure: true
  timeout: 1h

